<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پخش مستقیم ویدئو</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e7eef5;color:#17304d;font-family:Tahoma,Arial,sans-serif}main{max-width:980px;margin:24px auto;padding:22px;background:#fff;border:3px solid #17304d;border-radius:16px}h1{margin:0 0 8px}h2{font-size:18px;margin:22px 0 10px}p{color:#526578;line-height:1.8}.settings{display:flex;gap:8px;align-items:center}.settings input{flex:1}input,select{padding:10px;border:1px solid #9db0c0;border-radius:6px;direction:ltr;text-align:left;width:100%}.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.slot{border:2px solid #b7c5d2;border-radius:10px;padding:12px}.slot b{display:block;margin-bottom:8px}.slot-actions{display:flex;gap:6px;margin-top:8px}.slot-actions button{flex:1;margin:0}button{border:0;border-radius:8px;padding:11px 16px;font-size:15px;cursor:pointer;color:#fff;background:#2878b8}button.start{background:#218c55;margin:14px 8px 0 0}.stop,.delete{background:#c83d43}.save{background:#6b55a5}.delete{font-size:13px}#status{font-weight:bold;margin-top:16px}.videos{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:20px}.videos video{width:100%;border-radius:8px;background:#111}.title{font-weight:bold;margin:8px 0}.picker{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center}.picker[hidden]{display:none}.picker-card{background:#fff;width:min(620px,92vw);padding:18px;border-radius:12px}.picker-path{direction:ltr;text-align:left;background:#eef3f7;padding:10px;border-radius:6px;word-break:break-all}.folder-list{max-height:300px;overflow:auto;border:1px solid #ccd8e2;margin:12px 0}.folder{display:block;width:100%;text-align:right;background:#fff;color:#17304d;border-radius:0;border-bottom:1px solid #e1e7ec}.picker-actions{display:flex;gap:8px;justify-content:flex-start}.picker-actions button{margin:0}@media(max-width:700px){.slots,.videos{grid-template-columns:1fr}.settings{display:block}.settings button{margin-top:8px;width:100%}main{margin:8px;padding:14px}}
.slots{grid-template-columns:1fr}.slot{display:grid;grid-template-columns:90px minmax(0,1fr) 110px 190px;align-items:center;gap:12px}.slot b{margin:0}.slot-actions{margin:0}.slot video{width:190px;height:108px;object-fit:contain;background:#111;border-radius:8px}.slot video:fullscreen{width:100%;height:100%}.videos{grid-template-columns:1fr}.videos>div{display:flex;align-items:center;gap:16px;border:2px solid #b7c5d2;border-radius:10px;padding:12px}.videos video{width:190px;height:108px;object-fit:contain}.videos video:fullscreen{width:100%;height:100%}.videos .title{flex:1;overflow-wrap:anywhere}@media(max-width:700px){.slot{grid-template-columns:1fr 110px}.slot b{grid-column:1/-1}.slot video{grid-column:1/-1;justify-self:center}.videos>div{flex-wrap:wrap}}
</style></head>
<body><main><h1>پخش مستقیم سه ویدئو</h1><p class="intro">برنامه فایل‌ها را از مسیر انتخاب‌شده می‌خواند و کپی یا Upload نمی‌کند.</p>
<section id="admin"><h2>مسیر ویدئوها</h2><div class="settings"><input id="root"><button class="save" id="pickRoot">Browse</button><button class="save" id="saveRoot">ذخیره مسیر</button></div><h2>انتخاب سه ویدئو</h2>
<div class="slots"><div class="slot"><b>ویدئوی ۱</b><select id="v1"></select><div class="slot-actions"><button class="delete" data-delete="1">حذف فایل</button></div></div><div class="slot"><b>ویدئوی ۲</b><select id="v2"></select><div class="slot-actions"><button class="delete" data-delete="2">حذف فایل</button></div></div><div class="slot"><b>ویدئوی ۳</b><select id="v3"></select><div class="slot-actions"><button class="delete" data-delete="3">حذف فایل</button></div></div></div>
<button class="start" id="save">ثبت انتخاب‌ها</button><button class="start" id="start">شروع اشتراک</button><button class="stop" id="stop">توقف</button></section><div id="status">در حال بررسی وضعیت…</div><section class="videos" id="videos"></section></main>
<div class="picker" id="picker" hidden><div class="picker-card"><h2>انتخاب پوشه ویدئوها</h2><div class="picker-path" id="pickerPath"></div><div class="folder-list" id="folderList"></div><div class="picker-actions"><button id="chooseFolder">انتخاب این پوشه</button><button id="upFolder">پوشه بالاتر</button><button id="closePicker" class="stop">لغو</button></div></div></div>
<script>
const $=id=>document.getElementById(id);let state,pickerPath='';
function pauseVideos(){document.querySelectorAll('video').forEach(video=>video.pause())}
let fullscreenVideo=null;
function fullscreenChanged(){const current=document.fullscreenElement||document.webkitFullscreenElement;if(current){fullscreenVideo=current.tagName==='VIDEO'?current:current.querySelector('video')}else if(fullscreenVideo){fullscreenVideo.pause();fullscreenVideo=null}}
document.addEventListener('fullscreenchange',fullscreenChanged);
document.addEventListener('webkitfullscreenchange',fullscreenChanged);
window.addEventListener('pagehide',pauseVideos);
window.addEventListener('popstate',pauseVideos);
function bind(){document.querySelectorAll('video').forEach(v=>{if(v.dataset.bound)return;v.dataset.bound='true';v.addEventListener('webkitendfullscreen',()=>{v.pause();fullscreenVideo=null});v.addEventListener('play',()=>{document.querySelectorAll('video').forEach(o=>{if(o!==v)o.pause()});if(v.requestFullscreen&&!document.fullscreenElement)v.requestFullscreen().catch(()=>{});else if(v.webkitEnterFullscreen&&!v.webkitDisplayingFullscreen)v.webkitEnterFullscreen()})})}
function updatePreview(i){const select=$('v'+i),slot=select.closest('.slot');let video=slot.querySelector('video');if(!video){video=document.createElement('video');video.controls=true;video.playsInline=true;video.preload='metadata';slot.append(video)}video.pause();video.hidden=!select.value;if(select.value){video.src='/preview?name='+encodeURIComponent(select.value)}else video.removeAttribute('src');bind()}
function fillSelects(){[1,2,3].forEach(i=>{const select=$('v'+i),selected=state.videos[i-1]?.name||'';select.replaceChildren(new Option('انتخاب فایل…',''));state.files.forEach(name=>select.add(new Option(name,name,false,name===selected)));select.onchange=()=>updatePreview(i);updatePreview(i)})}
async function getStatus(){const r=await fetch('/api/status');state=await r.json();$('root').value=state.rootPath;if(!state.canManage){$('admin').style.display='none';document.querySelector('.intro').textContent='این صفحه فقط برای تماشای ویدئوهاست؛ مدیریت مسیر و فایل‌ها فقط روی کامپیوتر سرور انجام می‌شود.'}else fillSelects();$('status').textContent=state.active?'سرویس فعال است؛ ویدئوها مستقیماً از مسیر انتخاب‌شده پخش می‌شوند.':'سرویس متوقف است.';$('videos').innerHTML=state.active?state.videos.map(v=>v?`<div><div class="title">${v.name}</div><video controls playsinline preload="metadata" src="${v.url}"></video></div>`:'').join(''):'';bind()}
async function post(url,body){if(url==='/api/start'&&!state.active)await post('/api/config',{names:[1,2,3].map(i=>$('v'+i).value)});const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})});const d=await r.json();if(!r.ok)throw Error(d.error||'خطا');return d}
async function showFolders(folder){const r=await fetch('/api/folders?path='+encodeURIComponent(folder||''));const d=await r.json();if(!r.ok)throw Error(d.error||'پوشه قابل خواندن نیست');pickerPath=d.current;$('pickerPath').textContent=d.current;$('folderList').innerHTML=d.folders.map(name=>`<button class="folder" data-folder="${encodeURIComponent(name)}">📁 ${name}</button>`).join('');document.querySelectorAll('[data-folder]').forEach(b=>b.onclick=()=>showFolders(d.current+'\\'+decodeURIComponent(b.dataset.folder)))}
$('pickRoot').onclick=async()=>{const button=$('pickRoot');button.disabled=true;try{$('status').textContent='پوشه را در پنجره ویندوز انتخاب کنید…';const r=await fetch('/api/pick-folder');const d=await r.json();if(!r.ok)throw Error(d.error||'انتخاب پوشه انجام نشد.');if(d.path){await post('/api/settings',{rootPath:d.path});await getStatus();$('status').textContent=state.files.length?`${state.files.length} ویدئو پیدا شد؛ برای پخش «شروع اشتراک» را بزنید.`:'در این پوشه فایل ویدئویی پیدا نشد.'}else $('status').textContent='انتخاب پوشه لغو شد.'}catch(e){$('status').textContent=e.message||'انتخاب‌گر ویندوز اجرا نشد.'}finally{button.disabled=false}};
$('saveRoot').onclick=async()=>{try{await post('/api/settings',{rootPath:$('root').value});await getStatus()}catch(e){$('status').textContent=e.message}};$('save').onclick=async()=>{try{await post('/api/config',{names:[1,2,3].map(i=>$('v'+i).value)});$('status').textContent='انتخاب‌ها ثبت شد؛ اکنون شروع اشتراک را بزنید.'}catch(e){$('status').textContent=e.message}};$('start').onclick=async()=>{try{await post('/api/start');await getStatus()}catch(e){$('status').textContent=e.message}};$('stop').onclick=async()=>{try{await post('/api/stop');await getStatus()}catch(e){$('status').textContent=e.message}};document.querySelectorAll('[data-delete]').forEach(button=>button.onclick=async()=>{const name=$('v'+button.dataset.delete).value;if(!name){$('status').textContent='ابتدا فایل مورد نظر را انتخاب کنید.';return}if(!confirm('این فایل از روی هارد حذف شود؟'))return;try{await post('/api/delete',{name});await getStatus()}catch(e){$('status').textContent=e.message}});getStatus().catch(()=>$('status').textContent='ارتباط با سرویس برقرار نیست.');
</script></body></html>
