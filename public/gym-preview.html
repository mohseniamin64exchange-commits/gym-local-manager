<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>طرح بخش آموزش باشگاه</title>
<style>
:root{--navy:#17304d;--bg:#dfe9f1;--line:#b9cbd9;--blue:#246fa5;--green:#218454}*{box-sizing:border-box}body{margin:0;font:15px Tahoma,Arial,sans-serif;background:var(--bg);color:var(--navy)}button,input,textarea,select{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer}.shell{display:grid;grid-template-columns:218px minmax(0,1fr);min-height:100vh}.sidebar{background:var(--navy);color:white;padding:28px 18px}.brand{font-size:24px;font-weight:bold;margin:0 0 8px}.brand-sub{color:#abc0d3;line-height:1.9;font-size:12px}.nav{display:grid;gap:8px;margin-top:35px}.nav button{border:0;background:transparent;color:#c6d8e7;text-align:right;border-radius:9px;padding:14px}.nav button.active{background:#31516f;color:white;border:1px solid #6c89a3}.sidebar small{display:block;margin-top:40px;color:#a8bfd3;line-height:2}.main{padding:28px 34px;max-width:1300px;width:100%}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:20px}.top h1{font-size:25px;margin:0 0 9px}.muted{color:#61798d;line-height:1.9;font-size:13px}.tag{border:1px solid #9bb4c8;background:#edf4f9;color:#496c87;padding:8px 12px;border-radius:20px;font-size:12px;white-space:nowrap}.card{background:#fff;border:3px solid var(--navy);border-radius:14px;padding:22px;margin-bottom:18px}.tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}.tabs button{background:#fff;border:2px solid var(--line);border-radius:8px;padding:10px 18px;color:var(--navy)}.tabs button.active{background:var(--navy);color:white;border-color:var(--navy)}.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:14px;margin-bottom:20px}label{display:grid;gap:8px;font-size:13px;font-weight:bold}input,textarea,select{width:100%;border:2px solid var(--line);border-radius:8px;padding:11px;background:white;color:var(--navy)}input:focus,textarea:focus,select:focus{outline:2px solid #79a8c8;outline-offset:2px}.groups{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.group{border:2px solid var(--line);background:#f5f9fc;border-radius:10px;padding:18px;text-align:right;color:var(--navy)}.group strong{display:block;font-size:17px;margin:12px 0 8px}.icon{font-size:25px}.section-title{display:flex;justify-content:space-between;align-items:center;gap:14px;margin:24px 0 12px}.section-title h2{font-size:18px;margin:0}.count{color:#61798d;font-size:12px}.row{display:flex;justify-content:space-between;align-items:center;gap:20px;background:white;border:2px solid var(--line);border-radius:11px;padding:14px 18px;margin:10px 0;text-decoration:none;color:var(--navy)}.row:hover{border-color:var(--blue);background:#f7fbfd}.row-info{flex:1;min-width:0}.row h3{font-size:19px;margin:0 0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;color:#5b758b}.chip{background:#edf3f7;border-radius:5px;padding:5px 8px}.thumb{width:150px;height:95px;flex:0 0 150px;background:#eaf1f6;border:2px solid #c7d7e3;border-radius:8px;display:grid;place-items:center}.thumb svg,.hero svg{width:90%;height:90%}.btn{border:2px solid transparent;border-radius:8px;padding:11px 16px;background:var(--blue);color:white;font-weight:bold}.btn.green{background:var(--green)}.btn.outline{border-color:var(--line);background:white;color:var(--navy)}.btn.purple{background:#7154a2}.actions{display:flex;gap:10px;flex-wrap:wrap}.back{border:0;background:none;color:var(--blue);padding:0;margin-bottom:18px;cursor:pointer}.detail{display:grid;grid-template-columns:1fr 1fr;gap:24px}.hero{background:#edf4f8;border:2px solid var(--line);border-radius:12px;height:280px;display:grid;place-items:center;position:relative}.caption{font-size:12px;color:#698298;margin-top:8px}.detail h2{font-size:21px;margin:0 0 12px}.body-text{line-height:2.2;margin:14px 0;color:#4c677e}.notice{background:#f4f8fb;border-right:4px solid var(--blue);padding:12px 16px;line-height:2;font-size:13px;margin:18px 0}.steps{line-height:2.1;padding-right:20px;color:#4c677e}.device-header{display:flex;align-items:center;gap:24px}.device-header .hero{width:190px;height:160px;flex:none}.device-header h2{font-size:24px;margin:0 0 12px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.wide{grid-column:1/-1}.upload{border:2px dashed #9ab5ca;background:#f7fafc;padding:16px;border-radius:10px;display:flex;align-items:center;justify-content:space-between;gap:12px}.form-footer{border-top:2px solid var(--line);padding-top:18px;margin-top:22px;display:flex;justify-content:space-between;gap:14px;align-items:center}.demo-banner{font-size:12px;color:#61798d;margin-top:18px;line-height:2}dialog{border:3px solid var(--navy);border-radius:14px;width:min(660px,94vw);padding:24px;color:var(--navy)}dialog::backdrop{background:#10243aca}video{width:100%;max-height:65vh;background:#111}#toast{position:fixed;bottom:20px;left:20px;background:var(--navy);color:white;padding:14px 20px;border-radius:10px;max-width:85vw}#toast:empty{display:none}.empty{text-align:center;padding:30px;color:#698298}
@media(max-width:850px){.shell{grid-template-columns:1fr}.sidebar{padding:15px 18px}.brand{font-size:20px}.brand-sub,.sidebar small{display:none}.nav{display:flex;margin-top:15px;overflow:auto;gap:6px}.nav button{padding:10px;white-space:nowrap}.main{padding:20px 12px}.groups{grid-template-columns:repeat(2,1fr)}.detail{grid-template-columns:1fr}.filters{grid-template-columns:1fr}.row{gap:12px;padding:12px}.row h3{font-size:17px}.thumb{width:100px;height:80px;flex-basis:100px}.card{padding:16px}.form-grid{grid-template-columns:1fr}.device-header{align-items:flex-start}.device-header .hero{width:110px;height:120px}.top h1{font-size:22px}.tag{font-size:10px}.form-footer{align-items:flex-start;flex-direction:column}}
.shell>*{min-width:0}.main,#content,label{min-width:0}
@media(max-width:850px){.shell{grid-template-columns:minmax(0,1fr)}.top{flex-wrap:wrap}.form-grid{grid-template-columns:minmax(0,1fr)}.upload{flex-wrap:wrap}.nav{max-width:100%}}
</style></head>
<body><div class="shell"><aside class="sidebar"><div class="brand">باشگاه دیاکو</div><div class="brand-sub">کتابخانه آموزش حرکات</div><nav class="nav"><button data-screen="library">آموزش حرکات</button><button data-screen="device">آموزش دستگاه</button><button data-screen="exercise">صفحه حرکت</button><button data-screen="admin">مدیریت آموزش</button></nav><small>نمونه طراحی قابل بررسی<br>نمایش ورزشکار و مدیریت</small></aside><main class="main"><div id="content"></div><p class="demo-banner">نمونه گرافیکی • تصاویر شماتیک و متن‌ها نمونه‌اند. ذخیره‌سازی، QR و آموزش نهایی در مرحله پیاده‌سازی اضافه می‌شوند.</p></main></div><dialog id="player"><div class="section-title" style="margin:0 0 18px"><h2 id="playerTitle"></h2><button class="btn outline" id="closePlayer">بستن ×</button></div><video controls playsinline></video><p class="muted">برای پیش‌نمایش، یکی از ویدئوهای فعال سرویس فعلی استفاده می‌شود؛ این فیلم آموزش حرکت نیست.</p><p id="videoMessage" class="muted"></p></dialog><div id="toast" role="status"></div>
<script>
const exercises=[{id:'triceps-dumbbell',title:'پشت بازو با دمبل',group:'پشت بازو',device:'دمبل',level:'متوسط'},{id:'triceps-cable',title:'پشت بازو سیم‌کش',group:'پشت بازو',device:'سیم‌کش',level:'مقدماتی'},{id:'cable-row',title:'قایقی با سیم‌کش',group:'پشت',device:'سیم‌کش',level:'مقدماتی'},{id:'chest-press',title:'پرس سینه دستگاه',group:'سینه',device:'پرس سینه',level:'مقدماتی'},{id:'leg-press',title:'پرس پا دستگاه',group:'پا',device:'پرس پا',level:'مقدماتی'}];
const content=document.getElementById('content'),dialog=document.getElementById('player'),video=dialog.querySelector('video');let selected=exercises[0],filter='',tab='muscle';
const art=()=>`<svg viewBox="0 0 200 140" aria-label="تصویر شماتیک نمونه حرکت" role="img"><path d="M25 117H175M40 112V40H70M160 112V40H130" fill="none" stroke="#aec6d8" stroke-width="7" stroke-linecap="round"/><circle cx="102" cy="35" r="13" fill="#17304d"/><path d="M100 54L94 88M98 60L70 70L61 46M101 60L129 67L138 44M95 87L75 116M96 87L122 115" fill="none" stroke="#2878b8" stroke-width="10" stroke-linecap="round"/><path d="M50 42H72M127 40H149" stroke="#17304d" stroke-width="8" stroke-linecap="round"/></svg>`;
const pageHeader=(title,sub)=>`<header class="top"><div><h1>${title}</h1><div class="muted">${sub}</div></div><span class="tag">طرح اولیه آموزش</span></header>`;
function row(e){return `<a class="row" href="#exercise/${e.id}"><div class="row-info"><h3>${e.title}</h3><div class="meta"><span class="chip">${e.group}</span><span class="chip">${e.device}</span><span>مشاهده آموزش ←</span></div></div><div class="thumb">${art()}</div></a>`}
function library(){content.innerHTML=pageHeader('آموزش حرکات','حرکت را پیدا کنید؛ عکس و توضیح را بخوانید و آموزش ویدئویی را ببینید.')+`<div class="tabs"><button id="muscles" class="${tab==='muscle'?'active':''}">گروه‌های عضلانی</button><button id="devices" class="${tab==='device'?'active':''}">دستگاه‌ها و وسایل</button></div><section class="card"><div class="filters"><label>جست‌وجوی حرکت<input id="search" placeholder="مثلاً پشت بازو با دمبل"></label><label>گروه عضلانی<select id="group"><option value="">همه گروه‌ها</option>${['پشت بازو','پشت','سینه','پا'].map(g=>`<option>${g}</option>`).join('')}</select></label><label>وسیله<select id="equipment"><option value="">همه وسایل</option>${['دمبل','سیم‌کش','پرس سینه','پرس پا'].map(g=>`<option>${g}</option>`).join('')}</select></label></div><div class="groups">${(tab==='muscle'?['پشت بازو','پشت','سینه','پا']:['سیم‌کش','دمبل','پرس سینه','پرس پا']).map((g,i)=>`<button class="group" data-group="${g}"><span class="icon">${['◈','◇','▤','◉'][i]}</span><strong>${g}</strong><span class="muted">${exercises.filter(e=>(tab==='muscle'?e.group:e.device)===g).length} حرکت آموزشی</span></button>`).join('')}</div><div class="section-title"><h2>فهرست حرکات</h2><span id="count" class="count"></span></div><div id="results"></div></section>`;document.getElementById('group').value=filter;function update(){const query=document.getElementById('search').value.trim(),g=document.getElementById('group').value,d=document.getElementById('equipment').value,list=exercises.filter(e=>(!query||e.title.includes(query))&&(!g||e.group===g)&&(!d||e.device===d));document.getElementById('results').innerHTML=list.map(row).join('')||'<div class="empty">حرکتی با این مشخصات پیدا نشد.</div>';document.getElementById('count').textContent=list.length+' حرکت'}['search','group','equipment'].forEach(id=>document.getElementById(id).addEventListener('input',update));document.querySelectorAll('[data-group]').forEach(b=>b.onclick=()=>{document.getElementById(tab==='muscle'?'group':'equipment').value=b.dataset.group;update()});document.getElementById('muscles').onclick=()=>{tab='muscle';library()};document.getElementById('devices').onclick=()=>{tab='device';filter='';library()};update()}
function device(){content.innerHTML=pageHeader('آموزش دستگاه سیم‌کش','صفحه‌ای که ورزشکار بعد از اسکن QR روی دستگاه می‌بیند.')+`<section class="card"><div class="device-header"><div class="hero">${art()}</div><div><h2>دستگاه سیم‌کش</h2><p class="body-text">حرکت‌های مرتبط با این دستگاه را از فهرست زیر انتخاب کنید.</p><div class="meta"><span class="chip">شناسه ثابت دستگاه: D-001</span><span class="chip">۲ آموزش نمونه</span></div></div></div><div class="notice">در نسخه نهایی، توضیح تنظیم دستگاه و نکات تأییدشده مربی در این قسمت قرار می‌گیرد.</div><div class="section-title"><h2>حرکت‌های قابل انجام</h2></div>${exercises.filter(e=>e.device==='سیم‌کش').map(row).join('')}</section>`}
function exercise(){content.innerHTML=pageHeader(selected.title,'عکس، متن و ویدئو در یک صفحه مستقل با لینک ثابت.')+`<button class="back" id="back">→ بازگشت به فهرست حرکات</button><section class="card"><div class="detail"><div><h2>${selected.title}</h2><div class="meta"><span class="chip">${selected.group}</span><span class="chip">${selected.device}</span></div><p class="body-text">این قسمت محل معرفی کوتاه حرکت و هدف آموزشی آن است. متن نهایی توسط مربی باشگاه نوشته و تأیید می‌شود.</p><div class="section-title"><h2>مراحل اجرای حرکت</h2></div><ol class="steps"><li>تصویر و توضیح وضعیت شروع حرکت.</li><li>تصویر و توضیح مسیر اجرای حرکت.</li><li>توضیح پایان حرکت و نکات مهم.</li></ol><div class="notice">نکات مربی و اشتباهات رایج در این بخش نمایش داده می‌شوند.</div><button id="play" class="btn">▶ پخش آموزش ویدئویی</button></div><div><div class="hero">${art()}</div><p class="caption">محل عکس اصلی حرکت؛ تصویر فعلی فقط شماتیک نمونه است.</p><div class="actions"><button class="btn outline" id="startPhoto">حالت شروع</button><button class="btn outline" id="endPhoto">حالت پایان</button></div></div></div></section><section class="card"><div class="section-title" style="margin-top:0"><h2>حرکات مرتبط</h2></div>${exercises.filter(e=>e.id!==selected.id&&e.group===selected.group).map(row).join('')||'<div class="muted">حرکت مرتبط دیگری در این نمونه ثبت نشده است.</div>'}</section>`;document.getElementById('back').onclick=()=>location.hash='library';document.getElementById('play').onclick=openVideo;['startPhoto','endPhoto'].forEach(id=>document.getElementById(id).onclick=()=>toast('در نسخه نهایی تصویر مرحله انتخاب‌شده نمایش داده می‌شود.'))}
function admin(){content.innerHTML=pageHeader('مدیریت حرکت آموزشی','ثبت محتوا، پیش‌نمایش و انتشار توسط مدیر یا مربی.')+`<section class="card"><div class="tabs"><button class="active">اطلاعات حرکت</button><button id="publicPreview">پیش‌نمایش ورزشکار</button></div><form id="form"><div class="form-grid"><label>عنوان حرکت<input required id="editTitle" value="${selected.title}"></label><label>نام‌های جایگزین<input placeholder="نام رایج یا انگلیسی حرکت"></label><label>گروه عضلانی<select><option>${selected.group}</option><option>سینه</option><option>پا</option></select></label><label>دستگاه یا وسیله<select><option>${selected.device}</option><option>سیم‌کش</option><option>دمبل</option></select></label><div class="upload"><div><strong>تصویر حرکت</strong><div class="muted">عکس اصلی و مراحل اجرا</div></div><button type="button" class="btn outline" data-demo="انتخاب عکس">انتخاب عکس</button></div><div class="upload"><div><strong>ویدئوی آموزش</strong><div class="muted">پخش مستقیم فایل روی سرور</div></div><button type="button" class="btn outline" data-demo="انتخاب ویدئو">انتخاب ویدئو</button></div><label class="wide">معرفی و روش اجرا<textarea rows="4" placeholder="توضیح حرکت را بنویسید…"></textarea></label><label class="wide">نکات و اشتباهات رایج<textarea rows="3" placeholder="نکات تأییدشده مربی…"></textarea></label><label>وضعیت<select><option>پیش‌نویس</option><option>منتشرشده</option><option>بایگانی</option></select></label><label>شناسه دائمی<input readonly value="${selected.id}"></label></div><div class="form-footer"><div class="actions"><button class="btn green" type="submit">ذخیره پیش‌نویس</button><button type="button" class="btn" id="preview">پیش‌نمایش</button><button type="button" class="btn purple" data-demo="چاپ QR">چاپ QR</button></div><span class="count">ویرایش محتوا، شناسه صفحه را تغییر نمی‌دهد.</span></div></form></section>`;document.getElementById('form').onsubmit=e=>{e.preventDefault();selected.title=document.getElementById('editTitle').value;toast('عنوان در همین نمونه تغییر کرد؛ ذخیره دائمی هنوز پیاده‌سازی نشده است.')};['preview','publicPreview'].forEach(id=>document.getElementById(id).onclick=()=>location.hash='exercise/'+selected.id);document.querySelectorAll('[data-demo]').forEach(b=>b.onclick=()=>toast(b.dataset.demo+' در نسخه اجرایی فعال می‌شود.'))}
let toastTimer;function toast(text){document.getElementById('toast').textContent=text;clearTimeout(toastTimer);toastTimer=setTimeout(()=>document.getElementById('toast').textContent='',4500)}
async function openVideo(){dialog.showModal();document.getElementById('playerTitle').textContent=selected.title;document.getElementById('videoMessage').textContent='در حال بررسی ویدئوی نمونه…';try{const r=await fetch('/api/manual/status'),s=await r.json(),f=s.videos.find(Boolean);if(!f)throw Error('ویدئوی فعالی برای پیش‌نمایش موجود نیست. در نسخه نهایی فیلم همین حرکت نمایش داده می‌شود.');video.src=f.url;document.getElementById('videoMessage').textContent='';video.play().catch(()=>{})}catch(e){document.getElementById('videoMessage').textContent=e.message}}
document.getElementById('closePlayer').onclick=()=>dialog.close();dialog.addEventListener('close',()=>{video.pause();video.removeAttribute('src');video.load()});window.addEventListener('pagehide',()=>video.pause());
function route(){if(dialog.open)dialog.close();const parts=location.hash.slice(1).split('/'),screen=parts[0]||'library';if(parts[1])selected=exercises.find(e=>e.id===parts[1])||selected;document.querySelectorAll('[data-screen]').forEach(b=>b.classList.toggle('active',b.dataset.screen===screen));({library,device,exercise,admin}[screen]||library)();window.scrollTo(0,0)}document.querySelectorAll('[data-screen]').forEach(b=>b.onclick=()=>location.hash=b.dataset.screen);window.addEventListener('hashchange',route);route();
</script></body></html>
