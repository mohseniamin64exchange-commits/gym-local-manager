<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>انتخاب مستقیم سه ویدئو</title>
<style>
:root{--navy:#17304d;--ink:#1e344b;--muted:#60758a;--surface:#fff;--line:#c4d1dc;--page:#dfe9f1;--green:#218c55;--red:#c83d43;--blue:#2878b8}body{background:linear-gradient(135deg,#dfe9f1 0%,#edf3f7 100%);color:var(--ink);font-family:Tahoma,"Segoe UI",sans-serif}main{max-width:1040px;margin:34px auto;padding:30px;background:var(--surface);border:3px solid var(--navy);border-radius:18px;box-shadow:0 12px 32px #17304d1c}h1{color:var(--navy);font-size:28px;letter-spacing:-.3px;margin:0 0 26px;padding-bottom:16px;border-bottom:2px solid var(--line)}.row{background:#fbfdff;border:2px solid var(--line);border-radius:14px;padding:16px 18px;margin:14px 0;box-shadow:0 4px 12px #17304d12;transition:border-color .15s,box-shadow .15s}.row:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px #2878b822}.row b{color:var(--navy);font-size:16px}.title-input{border:2px solid var(--line);border-radius:8px;padding:11px 12px;font:inherit;color:var(--ink)}.title-input:focus{outline:0;border-color:var(--blue)}button{font-weight:700;border-radius:9px;transition:filter .15s,transform .05s}button:hover{filter:brightness(.94)}button:active{transform:translateY(1px)}.start{background:var(--green)}.stop,.delete{background:var(--red)}video{border:2px solid #263c50;box-shadow:0 5px 14px #17304d26}.actions{padding-top:10px;border-top:2px solid var(--line)}#status{color:var(--muted);font-size:14px;font-weight:700;padding-top:6px}body.viewer .row{background:var(--surface);min-height:150px}body.viewer .filename{color:var(--navy);font-size:26px;line-height:1.5}@media(max-width:700px){main{margin:10px;padding:18px;border-width:2px;border-radius:14px}h1{font-size:23px}.row{padding:14px}.actions{flex-direction:column}.actions button{width:100%}body.viewer .filename{font-size:22px}}
body.viewer .row b{display:none}body.viewer .filename{font-size:24px;font-weight:700}
body.viewer .row{grid-template-columns:minmax(0,1fr) 220px;gap:24px;min-height:132px}body.viewer .filename{grid-column:1;text-align:right;padding:12px 18px}body.viewer .row video{grid-column:2;grid-row:1;justify-self:center}
@media(max-width:700px){body.viewer .row{grid-template-columns:1fr;gap:10px}body.viewer .filename{grid-column:1;text-align:center}body.viewer .row video{grid-column:1;grid-row:auto}}
body.viewer .row{display:flex;flex-direction:row;justify-content:space-between;align-items:center;gap:28px}body.viewer .filename{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}body.viewer .row video{flex:0 0 190px}
@media(max-width:700px){body.viewer .row{display:flex;flex-direction:column;gap:10px}body.viewer .filename{flex:none;width:100%;white-space:normal;text-align:center}body.viewer .row video{flex:none}}
*{box-sizing:border-box}body{margin:0;background:#e7eef5;color:#17304d;font-family:Tahoma,Arial,sans-serif}main{max-width:980px;margin:24px auto;padding:22px;background:white;border:3px solid #17304d;border-radius:16px}h1{font-size:25px;margin:0 0 18px}.row{display:grid;grid-template-columns:90px minmax(0,1fr) 120px 90px 190px;gap:12px;align-items:center;border:2px solid #b7c5d2;border-radius:10px;padding:12px;margin:12px 0}.filename{overflow-wrap:anywhere;font-size:14px}button{border:0;border-radius:8px;padding:12px;color:white;background:#2878b8;cursor:pointer;font-family:inherit}.delete,.stop{background:#c83d43}.start{background:#218c55}button:disabled{opacity:.5}video{width:190px;height:108px;background:#111;object-fit:contain;border-radius:8px}video:fullscreen{width:100%;height:100%}.actions{display:flex;gap:10px;margin:18px 0}#status{line-height:1.8}body.viewer .manage{display:none}body.viewer .row{grid-template-columns:90px minmax(0,1fr) 190px}@media(max-width:700px){main{margin:8px;padding:14px}.row,body.viewer .row{grid-template-columns:1fr 1fr}.row b,.filename{grid-column:1/-1}video{grid-column:1/-1;justify-self:center}}
</style></head><body><main><h1>انتخاب مستقیم سه ویدئو</h1><div id="rows"></div><div class="actions manage"><button class="start" id="start">شروع اشتراک</button><button class="stop" id="stop">توقف اشتراک</button></div><div id="status" role="status"></div></main>
<script>
const rows=document.getElementById('rows'),status=document.getElementById('status');let state,fullVideo=null,busy=false;
for(let i=0;i<3;i++){const row=document.createElement('div');row.className='row';row.innerHTML=`<b>ویدئوی ${i+1}</b><input class="manage title-input" placeholder="عنوان، مثلاً فیلم قورمه‌سبزی"><span class="filename">فایلی انتخاب نشده</span><button class="manage choose">انتخاب فایل</button><button class="manage delete">حذف فایل</button><video controls playsinline preload="metadata" hidden></video>`;rows.append(row);const v=row.querySelector('video');v.addEventListener('play',()=>{document.querySelectorAll('video').forEach(o=>{if(o!==v)o.pause()});if(v.requestFullscreen&&!document.fullscreenElement)v.requestFullscreen().catch(()=>{});else if(v.webkitEnterFullscreen)v.webkitEnterFullscreen()});v.addEventListener('webkitendfullscreen',()=>v.pause());row.querySelector('.choose').onclick=()=>choose(i);row.querySelector('.delete').onclick=()=>remove(i)}
document.addEventListener('fullscreenchange',()=>{if(document.fullscreenElement)fullVideo=document.fullscreenElement;else if(fullVideo){fullVideo.pause();fullVideo=null}});window.addEventListener('pagehide',()=>document.querySelectorAll('video').forEach(v=>v.pause()));
async function post(url,body={}){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json();if(!r.ok)throw Error(d.error||'عملیات انجام نشد.');return d}
async function refresh(){const r=await fetch('/api/manual/status',{cache:'no-store'});if(!r.ok)throw Error('ارتباط برقرار نیست.');state=await r.json();document.body.classList.toggle('viewer',!state.canManage);[...rows.children].forEach((row,i)=>{const f=state.videos[i],v=row.querySelector('video');row.hidden=!state.canManage&&(!state.active||!f);row.querySelector('.filename').textContent=f?(state.canManage?f.name:(f.title||'ویدئو')):'فایلی انتخاب نشده';if(f){row.querySelector('.title-input').value=f.title||'';const source=f.url+'?name='+encodeURIComponent(f.name);if(v.getAttribute('src')!==source)v.src=source;v.hidden=false}else{v.pause();v.removeAttribute('src');v.hidden=true}row.querySelector('.choose').disabled=state.active||busy;row.querySelector('.delete').disabled=state.active||!f||busy});status.textContent=state.active?'اشتراک فعال است.':'اشتراک متوقف است.'}
async function choose(slot){if(busy)return;busy=true;try{await refresh();status.textContent='فایل را در پنجره ویندوز انتخاب کنید…';const r=await fetch('/api/pick-folder?file=1'),d=await r.json();if(!r.ok)throw Error(d.error);if(d.path)await post('/api/manual/select',{slot,path:d.path,title:rows.children[slot].querySelector('.title-input').value});busy=false;await refresh()}catch(e){busy=false;await refresh().catch(()=>{});status.textContent=e.message}}
async function remove(slot){if(!confirm('فایل واقعی این ویدئو از روی هارد حذف شود؟'))return;try{await post('/api/manual/delete',{slot});await refresh()}catch(e){status.textContent=e.message}}
document.getElementById('start').onclick=async()=>{try{await post('/api/manual/titles',{titles:[...rows.children].map(row=>row.querySelector('.title-input').value)});await post('/api/manual/start');await refresh()}catch(e){status.textContent=e.message}};document.getElementById('stop').onclick=async()=>{try{await post('/api/manual/stop');await refresh()}catch(e){status.textContent=e.message}};refresh().catch(e=>status.textContent=e.message);
</script></body></html>
